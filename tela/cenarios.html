<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulador de Linha — cenários A × B</title>
<!-- Simulador de Linha — etapa E5 (04/11/2026): compara o cenário A (a linha como está) com o B (o que você mudar), com as mesmas sementes. Abre pelo ABRIR_CENARIOS.bat. -->
<style>
:root{--s1:#2a78d6;--s2:#eb6834;--marca:#f2b705;--escuro:#1e2226;--tx:#1f2328;--tx2:#5b6168;--linha:#d9dce0;--fundo:#f4f5f6;--branco:#fff;--bom:#0a7a2f;--ruim:#b3261e}
*{box-sizing:border-box}html,body{margin:0}
body{font:14px/1.4 Arial,Helvetica,sans-serif;color:var(--tx);background:var(--fundo)}
header{position:sticky;top:0;z-index:5;background:var(--escuro);color:#fff;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
header h1{font-size:16px;margin:0 10px 0 0}header h1 small{display:block;font-weight:normal;color:#b9bec4;font-size:11px}
select,input,button{font:inherit}
header select{padding:6px 8px;border-radius:6px;border:1px solid #555;background:#2b2f33;color:#fff;max-width:330px}
header label{font-size:12px;color:#b9bec4}
button{cursor:pointer;border-radius:7px;border:1px solid #c5c9ce;background:var(--branco);padding:7px 12px;font-weight:bold;color:var(--tx)}
header button{background:#2b2f33;color:#fff;border-color:#555}header button.principal{background:var(--marca);color:#111;border-color:var(--marca)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--marca);outline-offset:1px}
.como{display:none;gap:6px;align-items:center}.como.aberto{display:flex}.como input{padding:6px 8px;border-radius:6px;border:1px solid #555;width:230px}
#estado{margin-left:auto;font-size:12px;color:#d6d9dc}
main{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:16px;max-width:1500px;margin:0 auto;padding:16px}
.painel{background:var(--branco);border:1px solid var(--linha);border-radius:10px;padding:12px 14px}
#dados{max-height:calc(100vh - 110px);overflow:auto;position:sticky;top:72px}
#resultado{min-width:0}
h2{font-size:16px;margin:0 0 8px;display:flex;align-items:center;gap:8px}h2::before{content:"";width:6px;height:18px;background:var(--marca);border-radius:2px}
h3{font-size:14px;margin:16px 0 6px}
details{border-top:1px solid #eceef0}details[open]{padding-bottom:6px}
summary{cursor:pointer;padding:8px 2px;font-weight:bold;list-style:none;display:flex;justify-content:flex-start;align-items:center;gap:6px}summary .mud{margin-left:auto}
summary::-webkit-details-marker{display:none}summary::before{content:"▸";color:var(--tx2);margin-right:6px}details[open]>summary::before{content:"▾"}
summary .mud{background:var(--marca);color:#111;border-radius:10px;padding:0 7px;font-size:11px;line-height:18px}
table{border-collapse:collapse;width:100%}
.par td,.par th{padding:4px 6px;border-bottom:1px solid #f0f1f2;text-align:left;font-size:13px}
.par th{color:var(--tx2);font-weight:normal;font-size:12px}
.par td.a{color:var(--tx2);white-space:nowrap;width:1%;text-align:right}
.par td.b{width:120px}.par input{width:110px;padding:5px 7px;border:1px solid #bfc4ca;border-radius:5px;background:#fffdf3;text-align:right}
.par tr.mudou td{background:#fff4cc}.par tr.mudou input{border-color:#c88a00;font-weight:bold}
.par tr.erro input{border-color:var(--ruim);background:#fdecea}
#mudancas{margin:8px 0 0;padding-left:18px;font-size:13px}#mudancas li{margin:2px 0}
.manchete{font-size:17px;font-weight:bold;margin:4px 0 10px}.manchete .bom{color:var(--bom)}.manchete .ruim{color:var(--ruim)}
.comp{width:100%;border-collapse:collapse;background:#fff}.comp th,.comp td{border:1px solid var(--linha);padding:7px 9px;text-align:right}
.comp th{background:var(--escuro);color:#fff;text-align:center;font-size:13px}.comp td:first-child,.comp th:first-child{text-align:left}
.comp td.dif.mud{color:#8a5a00;font-weight:bold}.comp td.dif.bom{color:var(--bom);font-weight:bold}.comp td.dif.ruim{color:var(--ruim);font-weight:bold}
.comp small{display:block;color:var(--tx2);font-size:11px}
.leg{display:flex;gap:14px;font-size:12px;color:var(--tx2);margin:4px 0 6px}.leg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.barras .l{display:grid;grid-template-columns:230px 1fr 120px;gap:8px;align-items:center;margin:6px 0;font-size:13px}
.barras .bb{display:grid;gap:2px}.barras .bb div{height:10px;border-radius:0 4px 4px 0;min-width:1px}
.barras .v{text-align:right;color:var(--tx2);font-size:12px}
.calc{display:flex;align-items:center;gap:10px;color:var(--tx2);font-size:13px;margin:6px 0}
.calc progress{width:160px;accent-color:var(--marca)}
.caixa-erro{background:#fdecea;border:1px solid #f3b9b3;border-radius:8px;padding:8px 12px;margin:8px 0;font-size:13px}
.nota{font-size:12px;color:var(--tx2)}
.selo{display:inline-block;background:var(--marca);color:#111;font-size:11px;font-weight:bold;border-radius:4px;padding:1px 6px;margin-left:6px}
@media (max-width:980px){main{grid-template-columns:minmax(0,1fr)}#dados{position:static;max-height:none}header{position:static}.barras .l{grid-template-columns:120px 1fr 90px}}
@media print{header,#dados{display:none}main{display:block;padding:0}.painel{border:0}}
</style>
</head>
<body>
<header>
  <h1>Cenários A × B<small>Simulador de Linha · A = a linha como está · B = o que você mudar</small></h1>
  <label for="arquivo">Linha</label><select id="arquivo"></select>
  <label for="sementes">Sementes</label><select id="sementes"><option>1</option><option selected>5</option><option>10</option><option>20</option></select>
  <button id="bZerar">B = A (desfazer tudo)</button>
  <button id="bSalvar" class="principal">Salvar B como…</button>
  <span class="como" id="caixaComo"><input id="nomeComo" aria-label="Nome do arquivo do cenário B"><button id="bComoOk" class="principal">Salvar</button><button id="bComoCancela">Cancelar</button></span>
  <button id="bImprimir">Imprimir / PDF</button>
  <span id="estado"></span>
</header>
<main>
  <section id="dados" class="painel" aria-label="Dados do cenário B"><h2>Dados da linha — A e B</h2>
    <p class="nota">Digite o novo valor na coluna B. Tudo o que não mudar fica igual ao A.</p>
    <div id="grupos"></div>
  </section>
  <section id="resultado" class="painel" aria-live="polite"><h2 id="tituloRes">Resultado</h2>
    <div id="calcA" class="calc"></div><div id="calcB" class="calc"></div>
    <div id="erros"></div>
    <div id="manchete" class="manchete"></div>
    <h3>O que mudou no B</h3><ul id="mudancas"><li>nada ainda — B igual ao A</li></ul>
    <div id="tabela"></div>
    <div id="perdas"></div>
    <div id="extra"></div>
    <p class="nota" id="rodape"></p>
  </section>
</main>
<script type="module" src="cenarios.js"></script>
</body>
</html>
