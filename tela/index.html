<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulador de Linha — tela 3D</title>
<!-- Simulador de Linha — etapa E4 (03/11/2026): reproduz em 3D o que o motor simulou, evento por evento. Abre sem internet (ABRIR_TELA_3D.bat). -->
<script type="importmap">{ "imports": { "three": "../lib/three/three.module.min.js", "three/addons/": "../lib/three/addons/" } }</script>
<style>
:root{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--marca:#f2b705;--painel:rgba(18,20,23,.86);--tx:#f0efec;--tx2:#b9b8b1}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#1a1c1f;color:var(--tx);font:13px/1.35 Arial,Helvetica,sans-serif}
#cena{position:fixed;inset:0;display:block;width:100%;height:100%}
.caixa{position:fixed;background:var(--painel);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:10px 12px;backdrop-filter:blur(4px)}
#topo{top:12px;left:12px;max-width:min(520px,calc(100% - 24px))}
#topo h1{margin:0;font-size:16px}#topo .sub{color:var(--tx2);font-size:12px;margin-top:2px}
.selo{display:inline-block;background:var(--marca);color:#111;font-weight:bold;font-size:11px;border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:2px}
#numeros{top:12px;right:12px;width:270px}
#numeros .l{display:flex;justify-content:space-between;gap:10px;padding:2px 0}#numeros .l b{font-size:14px}
#numeros h3{margin:8px 0 4px;font-size:11px;color:var(--tx2);text-transform:uppercase;letter-spacing:.06em}
.nao{color:#ff8a80}.sim{color:#7ee2a8}
#legenda{bottom:84px;left:12px;display:flex;flex-wrap:wrap;gap:10px;font-size:12px}
#legenda i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
#controles{bottom:12px;left:12px;right:12px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
button,.botao{font:inherit;font-weight:bold;color:var(--tx);background:#2b2f33;border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:7px 11px;cursor:pointer}
button[aria-pressed="true"]{background:var(--marca);color:#111;border-color:var(--marca)}
button:focus-visible{outline:2px solid var(--marca);outline-offset:2px}
#tempo{flex:1;min-width:160px;accent-color:var(--marca)}
#relogio{min-width:150px;text-align:right;font-variant-numeric:tabular-nums;color:var(--tx2)}
.grupo{display:flex;gap:4px}
.rotulo{position:fixed;transform:translate(-50%,-100%);pointer-events:none;background:rgba(18,20,23,.82);border-radius:6px;padding:3px 7px;font-size:11px;white-space:nowrap;border-left:4px solid #888}
.rotulo b{display:block;font-size:12px}
.rotulo.garg{outline:2px solid var(--marca)}.rotulo.garg span::after{content:" · gargalo";color:var(--marca);font-weight:bold}
#aviso{top:50%;left:50%;transform:translate(-50%,-50%);font-size:14px;text-align:center;max-width:420px}
input[type=file]{display:none}
@media (max-width:760px){#numeros{top:104px;left:12px;right:12px;width:auto;font-size:11px;display:grid;grid-template-columns:1fr 1fr;column-gap:14px;padding:6px 10px}#numeros h3{grid-column:1/-1;margin:4px 0 2px}#numeros .l b{font-size:12px}#legenda{display:none}#topo{right:12px;max-width:none}#relogio{min-width:0;text-align:left}}
</style>
</head>
<body>
<canvas id="cena" aria-label="Linha de produção em 3D"></canvas>
<div id="rotulos"></div>
<div id="topo" class="caixa"><h1 id="titulo">Simulador de Linha</h1><div class="sub" id="subtitulo">carregando…</div></div>
<div id="numeros" class="caixa" aria-live="polite">
  <h3>Agora (reprodução do dia 1)</h3>
  <div class="l"><span>Peças boas</span><b id="nBoas">0</b></div>
  <div class="l"><span>Refugo</span><b id="nRefugo">0</b></div>
  <div class="l"><span>Ritmo até agora</span><b id="nRitmo">—</b></div>
  <h3>Resultado da simulação inteira</h3>
  <div class="l"><span>Peças boas por dia</span><b id="rDia">—</b></div>
  <div class="l"><span>Demanda</span><b id="rDem">—</b></div>
  <div class="l"><span>Ritmo × takt</span><b id="rRitmo">—</b></div>
  <div class="l"><span>OEE da linha</span><b id="rOee">—</b></div>
  <div class="l"><span>Gargalo</span><b id="rGarg">—</b></div>
</div>
<div id="legenda" class="caixa"></div>
<div id="controles" class="caixa">
  <button id="bTocar" aria-label="Tocar ou pausar">⏸ Pausar</button>
  <div class="grupo" role="group" aria-label="Velocidade" id="velocidades"></div>
  <input id="tempo" type="range" min="0" max="1000" value="0" aria-label="Momento do dia">
  <span id="relogio">0 h 00 min</span>
  <div class="grupo" role="group" aria-label="Câmera">
    <button id="cGeral">Visão geral</button><button id="cGarg">Gargalo</button><button id="cEmp">Empilhadeira</button>
  </div>
  <label class="botao" for="arquivo">Abrir outra linha…</label><input id="arquivo" type="file" accept=".json,application/json">
</div>
<div id="aviso" class="caixa" hidden></div>
<script type="module" src="tela.js"></script>
</body>
</html>
